limit_req_zone $binary_remote_addr zone=general_limit:10m rate=25r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# HTTP -> Redirect ALL traffic (Domain & Direct IP) to HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://130-210-35-73.sslip.io$request_uri;
}

# HTTPS Main Server
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 130-210-35-73.sslip.io;

    ssl_certificate /etc/letsencrypt/live/130-210-35-73.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/130-210-35-73.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Connection and Request Limits
    limit_conn conn_limit 25;
    limit_req zone=general_limit burst=50 nodelay;

    # Buffer Overflow & Slowloris Protections
    client_body_buffer_size 128k;
    client_max_body_size 10M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout 15;
    client_header_timeout 15;
    keepalive_timeout 20;
    send_timeout 15;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block Bad Bots, Exploits, and Vulnerability Scanners
    if ($http_user_agent ~* (nikto|sqlmap|acunetix|dirbuster|nmap|masscan|wpscan|morfeus|fuzz|zgrab)) {
        return 403;
    }

    # Block Sensitive Files (.env, .git, etc.)
    location ~* /(\.git|\.env|\.svn|\.htaccess|wp-login\.php|phpmyadmin|cgi-bin) {
        deny all;
        return 404;
    }

    # API Route with Dedicated Rate Limiting
    location /api/ {
        limit_req zone=api_limit burst=15 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main Application
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
