services:
  dirtfree-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dirtfree-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 750M
        reservations:
          memory: 200M
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

